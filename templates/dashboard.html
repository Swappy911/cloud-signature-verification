<!DOCTYPE html>
<html>
<head>

<title>Cloud Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f2027;
color:white;
font-family:Arial;
}

.card{
border-radius:12px;
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-5">
Cloud Monitoring Dashboard
</h2>

<div class="row text-center">

<div class="col-md-3">
<div class="card bg-success p-4">
<h4>Server Status</h4>
<h3>🟢 {{ server_status }}</h3>
</div>
</div>

<div class="col-md-3">
<div class="card bg-primary p-4">
<h4>Active Users</h4>
<h3>{{ users }}</h3>
</div>
</div>

<div class="col-md-3">
<div class="card bg-warning p-4">
<h4>Total Verifications</h4>
<h3>{{ total }}</h3>
</div>
</div>

<div class="col-md-3">
<div class="card bg-info p-4">
<h4>Cloud Platform</h4>
<h5>{{ platform }}</h5>
</div>
</div>

</div>

<br><br>

<div class="row text-center">

<div class="col-md-6">
<div class="card bg-success p-4">
<h4>Valid Signatures</h4>
<h3>{{ valid }}</h3>
</div>
</div>

<div class="col-md-6">
<div class="card bg-danger p-4">
<h4>Invalid Signatures</h4>
<h3>{{ invalid }}</h3>
</div>
</div>

</div>

<br>

<a href="/" class="btn btn-light">
⬅ Back to Home
</a>

</div>

</body>
</html>
