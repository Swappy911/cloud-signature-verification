<!DOCTYPE html>
<html>
<head>

<title>Cloud Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#1e1e2f;
color:white;
}

.card{
border-radius:12px;
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
Cloud Verification Dashboard
</h2>

<div class="row text-center">

<div class="col-md-4">
<div class="card bg-primary text-white p-4">
<h3>{{ users }}</h3>
<p>Total Users</p>
</div>
</div>

<div class="col-md-4">
<div class="card bg-success text-white p-4">
<h3>{{ valid }}</h3>
<p>Valid Signatures</p>
</div>
</div>

<div class="col-md-4">
<div class="card bg-danger text-white p-4">
<h3>{{ invalid }}</h3>
<p>Invalid Signatures</p>
</div>
</div>

</div>

<br><br>

<div class="card p-4">

<h4>Cloud Information</h4>

<ul>
<li>Cloud Model: Public Cloud</li>
<li>Service Model: PaaS</li>
<li>Platform: Render</li>
</ul>

</div>

</div>

</body>
</html>
